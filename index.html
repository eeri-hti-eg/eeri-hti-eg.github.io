<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EERI HTI Student Chapter | Official Website</title>
    <!-- React & Tailwind CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        seismic: { dark: '#080c14', card: '#0f172a', border: '#1e293b', red: '#e11d48', accent: '#38bdf8', muted: '#94a3b8' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Space Grotesk', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #080c14; color: #f8fafc; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        .blueprint-grid { background-image: linear-gradient(to right, rgba(56, 189, 248, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(56, 189, 248, 0.03) 1px, transparent 1px); background-size: 32px 32px; }
        .bento-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid #1e293b; transition: all 0.3s ease; }
        .bento-card:hover { border-color: #38bdf8; transform: translateY(-4px); }
        .shimmer { background: linear-gradient(90deg, rgba(225,29,72,0) 0%, rgba(225,29,72,0.1) 50%, rgba(225,29,72,0) 100%); background-size: 200% 100%; animation: shimmer 3s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="blueprint-grid">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Nav = () => (
            <nav className="fixed w-full z-50 bg-seismic-dark/80 backdrop-blur-xl border-b border-seismic-border">
                <div className="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
                    <div className="flex items-center gap-3">
                        <img src="assets/logo.png" alt="Logo" className="h-10 w-10 bg-white p-1 rounded-lg" />
                        <span className="font-heading font-bold text-xl tracking-tighter text-white">EERI HTI</span>
                    </div>
                    <div className="hidden md:flex gap-8 text-[10px] font-bold uppercase tracking-[0.2em] text-seismic-muted">
                        <a href="#about" className="hover:text-white transition-colors">Origins</a>
                        <a href="#projects" className="hover:text-white transition-colors">Projects</a>
                        <a href="#gallery" className="hover:text-white transition-colors">Gallery</a>
                        <a href="#leadership" className="hover:text-white transition-colors">Leadership</a>
                        <a href="#alumni" className="hover:text-white transition-colors">Alumni</a>
                        <a href="#sponsor" className="bg-seismic-red text-white px-5 py-2 rounded-lg hover:bg-rose-600 shadow-lg shadow-rose-900/20">Partner</a>
                    </div>
                </div>
            </nav>
        );

        const Countdown = () => {
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, mins: 0, secs: 0 });
            useEffect(() => {
                const target = new Date('March 23, 2027 09:00:00').getTime();
                const interval = setInterval(() => {
                    const now = new Date().getTime();
                    const distance = target - now;
                    setTimeLeft({
                        days: Math.floor(distance / (1000 * 60 * 60 * 24)),
                        hours: Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                        mins: Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
                        secs: Math.floor((distance % (1000 * 60)) / 1000)
                    });
                }, 1000);
                return () => clearInterval(interval);
            }, []);
            return (
                <div className="grid grid-cols-4 gap-4 max-w-md mt-12 bg-seismic-card/80 p-6 rounded-[32px] border border-seismic-accent/20 backdrop-blur-xl shadow-2xl">
                    {Object.entries(timeLeft).map(([label, val]) => (
                        <div key={label} className="text-center bg-seismic-dark/50 py-3 rounded-2xl border border-seismic-border">
                            <span className={`text-3xl font-heading font-bold block ${label === 'secs' ? 'text-seismic-red' : 'text-white'}`}>
                                {val < 10 ? `0${val}` : val}
                            </span>
                            <span className="text-[8px] font-bold text-seismic-muted uppercase tracking-[0.2em]">{label}</span>
                        </div>
                    ))}
                </div>
            );
        };

        const Gallery = () => {
            const imgs = [
                'assets/photos/tori_tower.jpg', 'assets/photos/pearl_tower.jpg', 'assets/photos/berkeley_team.jpg',
                'assets/photos/spaghetti_win.jpg', 'assets/photos/bbm_team.jpg', 'assets/photos/es_team.jpg',
                'SDC25 Photos/Shake-012.jpg', 'SDC25 Photos/Shake-354.jpg', 'SDC25 Photos/Shake-366.jpg',
                'SDC 26 Photos/Tower-22.jpg', 'SDC 26 Photos/Tower-6.jpg', 'SDC 26 Photos/Shake430.jpg',
                'AZEX 2025/HTI team .jpg', 'AZEX 2025/IMG_2209.JPG', 'AZEX 2025/photo_2025-05-09_21-35-11.jpg'
            ];
            return (
                <section id="gallery" className="py-32 px-6 max-w-7xl mx-auto">
                    <div className="text-center mb-20">
                        <span className="text-seismic-accent text-[10px] font-bold uppercase tracking-[0.4em] block mb-4">// Visual Archive</span>
                        <h2 className="text-5xl font-extrabold text-white tracking-tighter italic">GALLERY IN MOTION</h2>
                    </div>
                    <div className="columns-2 md:columns-3 lg:columns-4 gap-4 space-y-4">
                        {imgs.map((src, i) => (
                            <div key={i} className="relative group overflow-hidden rounded-[24px] border border-seismic-border">
                                <img src={src} className="w-full grayscale group-hover:grayscale-0 transition-all duration-700 group-hover:scale-105" />
                                <div className="absolute inset-0 bg-gradient-to-t from-seismic-dark/60 to-transparent opacity-0 group-hover:opacity-100 transition-all"></div>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const MemberCard = ({ img, name, title, red }) => (
            <div className={`group bento-card p-6 rounded-[32px] ${red ? 'border-seismic-red/30' : ''}`}>
                <div className="relative mb-6 overflow-hidden rounded-[24px] aspect-square">
                    <img src={`assets/team/${img}`} className="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700" />
                    {red && <div className="absolute inset-0 shimmer opacity-30"></div>}
                </div>
                <h3 className="font-heading font-bold text-lg text-white">{name}</h3>
                <p className={`text-[10px] font-bold uppercase tracking-[0.2em] mt-2 ${red ? 'text-seismic-red' : 'text-seismic-muted'}`}>{title}</p>
            </div>
        );

        const App = () => (
            <div className="relative">
                <Nav />

                {/* Hero */}
                <section className="min-h-screen pt-20 px-6 flex items-center relative overflow-hidden">
                    <div className="absolute inset-0 z-0"><img src="assets/photos/hero_bg.jpg" className="w-full h-full object-cover opacity-20 scale-110" /></div>
                    <div className="max-w-7xl mx-auto w-full relative z-10 grid lg:grid-cols-2 gap-16 items-center">
                        <div>
                            <div className="inline-block px-3 py-1 rounded-full bg-seismic-red/10 border border-seismic-red/30 text-seismic-red text-[10px] font-bold uppercase tracking-widest mb-8 animate-pulse">Official EERI Student Chapter</div>
                            <h1 className="text-6xl md:text-8xl font-extrabold text-white leading-[0.85] tracking-tighter mb-10 italic">ENGINEERING<br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-seismic-red to-amber-500 underline decoration-seismic-red underline-offset-8">RESILIENT</span><br/>CITIES</h1>
                            <p className="text-seismic-muted text-lg max-w-lg leading-relaxed font-light mb-12">Bridging Architecture & Civil Engineering. Designing the future of seismic-resistant structures.</p>
                            <div className="flex flex-wrap gap-6"><a href="https://forms.cloud.microsoft/r/mbHaMQLAjh" target="_blank" className="bg-seismic-red text-white px-10 py-5 rounded-2xl font-bold uppercase tracking-widest text-[10px] hover:bg-rose-600 transition-all shadow-2xl shadow-rose-950/40">Apply Now</a><a href="#sponsor" className="border border-seismic-border text-white px-10 py-5 rounded-2xl font-bold uppercase tracking-widest text-[10px] hover:bg-seismic-card transition-all">Support Us</a></div>
                        </div>
                        <Countdown />
                    </div>
                </section>

                {/* Leadership */}
                <section id="leadership" className="py-32 px-6 max-w-7xl mx-auto">
                    <div className="text-center mb-24">
                        <span className="text-seismic-accent text-[10px] font-bold uppercase tracking-[0.4em] block mb-4">// Chapter Hierarchy</span>
                        <h2 className="text-5xl font-extrabold text-white tracking-tighter italic">LEADERSHIP Season 26/27</h2>
                    </div>
                    <div className="grid md:grid-cols-4 gap-8">
                        <div className="md:col-span-2"><MemberCard img="abdulrahman_hussam.jpg" name="Abdulrahman Hussam" title="President & Team Leader" red /></div>
                        <div className="md:col-span-2 grid grid-cols-2 gap-8"><MemberCard img="ahmed_tarek.jpg" name="Ahmed Tarek" title="Structural Captain" /><MemberCard img="sara_ahmed.jpg" name="Sara Ahmed Ghanem" title="Architecture Captain" /></div>
                        <div className="col-span-full grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6 mt-12">
                            {[ {n:"Zyad Abo Youssef", t:"Fabrication Captain", i:"zyad_abo_youssef.jpg"}, {n:"Ahmed Nabil Ibrahim", t:"PR Lead", i:"ahmed_nabil.jpg"}, {n:"Ibrahim Hatem", t:"Logistics Lead", i:"ibrahim_hatem.jpeg"}, {n:"Menna Elshazly", t:"Creative Lead", i:"menna_elshazly.jpeg"}, {n:"Mahmoud Tarek", t:"Corporate Coordinator", i:"mahmoud_tarek.jpeg"} ].map((m, i) => (
                                <div key={i} className="text-center group"><div className="aspect-square rounded-[32px] bg-seismic-card border border-seismic-border overflow-hidden mb-5 p-2 group-hover:border-seismic-accent transition-all"><img src={`assets/team/${m.i}`} className="w-full h-full object-cover rounded-[24px] grayscale group-hover:grayscale-0 transition-all duration-500" /></div><h4 className="text-xs font-bold text-white group-hover:text-seismic-accent transition-colors">{m.n}</h4><p className="text-[8px] text-seismic-muted uppercase font-mono tracking-widest mt-1">{m.t}</p></div>
                            ))}
                        </div>
                    </div>
                </section>

                <Gallery />

                {/* Alumni */}
                <section id="alumni" className="py-32 px-6 bg-seismic-dark/50 border-y border-seismic-border">
                    <div className="max-w-7xl mx-auto">
                        <div className="text-center mb-24"><span className="text-seismic-red text-[10px] font-bold uppercase tracking-[0.4em] block mb-4">// Honor Roll</span><h2 className="text-5xl font-extrabold text-white tracking-tighter italic">ALUMNI REGISTRY</h2></div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-6">
                            {["Moazz Al-Maasry", "Mostafa Abdellatief", "Abdulaziz Saeed", "Ahmed Saber", "Mohamed Imam", "Karim Elfouly", "Osama Safwat", "Mahmoud Helaly", "Abdullah Khaled", "Hajar Ehab", "Nada Osama", "Haya Maged", "Menna Okasha"].map((name, i) => (
                                <div key={i} className="bg-seismic-card/30 p-5 rounded-[24px] border border-seismic-border flex items-center gap-4 hover:border-white/20 transition-all group">
                                    <div className="w-12 h-12 rounded-full bg-seismic-dark border border-seismic-border overflow-hidden"><img src={`assets/alumni/${name.toLowerCase().split(' ')[0]}.jpg`} className="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all" /></div>
                                    <span className="text-[11px] font-bold text-white leading-none">{name}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>

                <section id="sponsor" className="py-32 px-6 max-w-7xl mx-auto text-center">
                    <div className="bg-seismic-card border border-seismic-red/20 rounded-[56px] p-12 lg:p-24 shadow-2xl shadow-rose-950/10">
                        <h2 className="text-5xl font-extrabold text-white mb-8 tracking-tighter italic uppercase">Build with Us</h2>
                        <p className="text-seismic-muted max-w-xl mx-auto mb-16 font-light">Partner with Egypt's elite student talent. Your support fuels international innovation.</p>
                        <form action="https://formsubmit.co/eeri@hti.edu.eg" method="POST" className="grid gap-6 max-w-2xl mx-auto">
                            <input type="text" name="company" placeholder="Organization" className="w-full bg-seismic-dark border border-seismic-border rounded-2xl px-8 py-5 text-sm text-white focus:outline-none focus:border-seismic-red transition-all" required />
                            <input type="email" name="email" placeholder="Contact Email" className="w-full bg-seismic-dark border border-seismic-border rounded-2xl px-8 py-5 text-sm text-white focus:outline-none focus:border-seismic-red transition-all" required />
                            <textarea name="message" placeholder="Proposal / Inquiry..." rows="4" className="w-full bg-seismic-dark border border-seismic-border rounded-2xl px-8 py-5 text-sm text-white focus:outline-none focus:border-seismic-red transition-all"></textarea>
                            <button type="submit" className="w-full bg-seismic-red text-white py-6 rounded-2xl font-bold uppercase tracking-[0.2em] text-[10px] hover:bg-rose-600 shadow-xl transition-all">Submit Partnership Inquiry</button>
                        </form>
                    </div>
                </section>

                <footer className="py-12 text-center text-seismic-muted text-[10px] uppercase tracking-[0.4em] font-mono italic">
                    © 2026 EERI HTI STUDENT CHAPTER · HTI 10TH OF RAMADAN
                </footer>
            </div>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
